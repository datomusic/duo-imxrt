[project]
name = "duo-imxrt-updater"
version = "2.4.0"
description = "Firmware updater for DUO i.MX RT"
dependencies = [
    "python-rtmidi==1.5.8",
    "spsdk>=3.11.0,<4",
    "pyusb",
]
# Avoiding python 3.14 because the wheels are not available for some packages
requires-python = ">=3.12.0, <3.14"
