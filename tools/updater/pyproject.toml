[project]
name = "duo-imxrt-updater"
version = "2.4.0"
description = "Firmware updater for DUO i.MX RT"
dependencies = [
    "python-rtmidi==1.5.8",
    "spsdk>=3.11.0,<4",
    "pyusb",
]
# Avoiding python 3.14 because the wheels are not available for some packages
requires-python = ">=3.12.0, <3.14"

[tool.uv]
# Intel Macs are on the bench (setup-mac.sh). cryptography 49 dropped its
# x86_64 macOS wheels, and building it from source needs Rust + OpenSSL.
# Stay on 48.x there; everything else gets the latest.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
